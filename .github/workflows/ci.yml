name: CI and GitHub Pages

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the tests need nothing but Playwright; keep it out of the gulp dependency tree
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.62.1
          ln -s "$RUNNER_TEMP/pw/node_modules" node_modules
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Original ROMs, headless emulator
        run: npm run test:roms
      - name: Audio worklet
        run: npm run test:audio
      - name: Player in a real browser
        run: npm run test:ui
      - name: Screenshots of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/out/*.png
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (the player is src/dev.html, served as the home page)
        run: |
          mkdir _site
          cp -r src/. _site/
          cp src/dev.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
